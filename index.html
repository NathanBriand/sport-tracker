<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T & N — Sport Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Unbounded:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Fond général clair-foncé, pas noir charbon */
  --bg:#12131a;--bg2:#1a1b26;--bg3:#22243a;--bg4:#2a2d45;--bg5:#333658;
  --border:#2e3152;--border2:#3d4170;--border3:#5560aa;
  --text:#e8eaf6;--text2:#b0b8e0;--text3:#7078a8;

  /* Théo = bleu vif */
  --T:#5b7fff;--T2:#8aa4ff;--T3:#1e2d6e;--T-bg:#1a2248;
  /* Nathan = rouge-rose vif */
  --N:#ff4f6d;--N2:#ff8096;--N3:#5c1525;--N-bg:#2a1220;

  --pull:#2dd4bf;--push:#fb923c;--legs:#818cf8;--custom:#c084fc;
  --green:#4ade80;--yellow:#fbbf24;--red:#f87171;
  --r:12px;--r-sm:8px;--r-lg:18px;
}

body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* ─── NAV ─── */
nav{position:sticky;top:0;z-index:100;background:rgba(18,19,26,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 2rem;height:60px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:900;letter-spacing:1px;display:flex;align-items:center;gap:10px}
.logo .t{color:var(--T2)}.logo .amp{color:var(--text3);font-weight:400}.logo .n{color:var(--N2)}
.logo-sub{font-family:'DM Mono',monospace;font-size:10px;font-weight:400;color:var(--text3);letter-spacing:2px;margin-left:4px;margin-top:2px}
.nav-links{display:flex;gap:4px}
.nav-btn{background:none;border:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:var(--text2);padding:8px 16px;border-radius:var(--r-sm);cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px}
.nav-btn:hover{color:var(--text);background:var(--bg3)}
.nav-btn.active{color:var(--text);background:var(--bg3);box-shadow:inset 0 0 0 1px var(--border2)}
.nav-btn i{font-size:16px}

/* ─── STATUS BAR ─── */
#status-bar{height:34px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 2rem;gap:8px;font-family:'DM Mono',monospace;font-size:11px;color:var(--text3)}
#status-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);transition:.3s;flex-shrink:0}
#status-dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}
#status-dot.err{background:var(--red);box-shadow:0 0 8px var(--red)}
#status-dot.loading{background:var(--yellow);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ─── PAGES ─── */
.page{display:none;position:relative;z-index:1}.page.active{display:block}
.page-inner{max-width:1080px;margin:0 auto;padding:2rem}

/* ─── PAGE HEADER ─── */
.page-title{font-family:'Unbounded',sans-serif;font-size:22px;font-weight:700;letter-spacing:-.5px;margin-bottom:2rem;color:var(--text)}
.page-title span{color:var(--text3);font-weight:400;font-size:12px;font-family:'DM Mono',monospace;display:block;margin-top:5px;letter-spacing:1.5px}

/* ─── DUAL GRID ─── */
.dual{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
@media(max-width:720px){.dual{grid-template-columns:1fr}}

/* ─── PLAYER CARD ─── */
.player-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;transition:.2s}
.player-card.theo-card{border-top:3px solid var(--T)}
.player-card.nathan-card{border-top:3px solid var(--N)}
.player-header{padding:1.1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,var(--bg3),var(--bg2))}
.player-name{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:700;letter-spacing:.5px}
.player-name.theo{color:var(--T2)}.player-name.nathan{color:var(--N2)}
.player-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Unbounded',sans-serif;font-size:13px;font-weight:700}
.player-avatar.theo{background:var(--T-bg);color:var(--T2);box-shadow:0 0 0 2px var(--T)}
.player-avatar.nathan{background:var(--N-bg);color:var(--N2);box-shadow:0 0 0 2px var(--N)}
.player-body{padding:1.5rem}

/* ─── FORM ─── */
.fg{margin-bottom:18px}
.fg label{display:block;font-family:'DM Mono',monospace;font-size:10px;font-weight:600;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:7px}
input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);
  color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;padding:10px 13px;outline:none;transition:.15s;
  -webkit-appearance:none;appearance:none
}
input:focus,select:focus{border-color:var(--border3);background:var(--bg4);box-shadow:0 0 0 3px rgba(91,127,255,.12)}
select option{background:var(--bg3)}
::placeholder{color:var(--text3)}

/* ─── TYPE SELECTOR ─── */
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type-btn{background:var(--bg3);border:2px solid var(--border);border-radius:var(--r-sm);padding:12px 10px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:7px;font-family:'DM Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.5px;color:var(--text2)}
.type-btn:hover{background:var(--bg4);color:var(--text);border-color:var(--border2);transform:translateY(-1px)}
.type-btn.sel-pull{background:rgba(45,212,191,.12);border-color:var(--pull);color:var(--pull);box-shadow:0 0 12px rgba(45,212,191,.15)}
.type-btn.sel-push{background:rgba(251,146,60,.12);border-color:var(--push);color:var(--push);box-shadow:0 0 12px rgba(251,146,60,.15)}
.type-btn.sel-legs{background:rgba(129,140,248,.12);border-color:var(--legs);color:var(--legs);box-shadow:0 0 12px rgba(129,140,248,.15)}
.type-btn.sel-custom{background:rgba(192,132,252,.12);border-color:var(--custom);color:var(--custom);box-shadow:0 0 12px rgba(192,132,252,.15)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-pull{background:var(--pull)}.dot-push{background:var(--push)}.dot-legs{background:var(--legs)}.dot-custom{background:var(--custom)}

/* ─── EXERCISE BUILDER ─── */
.ex-list{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.ex-item{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r-sm);padding:14px}
.ex-top{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.ex-top input{flex:1;font-size:14px;font-weight:500}
.ex-num{font-family:'DM Mono',monospace;font-size:11px;color:var(--T2);min-width:22px;font-weight:600}
.btn-icon{background:none;border:none;cursor:pointer;color:var(--text3);padding:5px;border-radius:6px;line-height:1;transition:.15s;display:inline-flex;align-items:center}
.btn-icon:hover{color:var(--text);background:var(--bg5)}
.rest-row{margin-bottom:12px}
.rest-lbl{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.rest-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chip{background:var(--bg4);border:1px solid var(--border2);border-radius:20px;padding:4px 12px;font-family:'DM Mono',monospace;font-size:11px;color:var(--text2);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--border3);color:var(--text);background:var(--bg5)}
.chip.on{background:var(--bg5);border-color:var(--T);color:var(--T2)}
.chip-input{background:var(--bg4);border:1px solid var(--border2);border-radius:20px;padding:4px 10px;font-family:'DM Mono',monospace;font-size:11px;color:var(--text2);width:70px;text-align:center;outline:none}
.chip-input:focus{border-color:var(--border3)}
.series-lbl{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.series-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.serie-row{display:flex;align-items:center;gap:3px;background:var(--bg4);border:1px solid var(--border2);border-radius:6px;padding:6px 10px}
.serie-row .sn{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);min-width:16px;font-weight:600}
.serie-row input{background:none;border:none;font-family:'DM Mono',monospace;font-size:13px;color:var(--text);text-align:center;padding:0;outline:none}
.serie-row input.reps{width:36px}
.serie-row input.wt{width:40px}
.serie-row .x{color:var(--text3);font-size:12px;padding:0 2px}
.serie-row .kg{color:var(--text3);font-size:11px}
.serie-row .del{margin-left:auto}

/* ─── BUTTONS ─── */
.btn{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;padding:10px 20px;border-radius:var(--r-sm);cursor:pointer;border:none;transition:.15s;display:inline-flex;align-items:center;gap:7px;letter-spacing:.1px}
.btn-T{background:var(--T);color:#fff;box-shadow:0 4px 14px rgba(91,127,255,.35)}.btn-T:hover{background:var(--T2);box-shadow:0 4px 20px rgba(91,127,255,.5);transform:translateY(-1px)}
.btn-N{background:var(--N);color:#fff;box-shadow:0 4px 14px rgba(255,79,109,.35)}.btn-N:hover{background:var(--N2);box-shadow:0 4px 20px rgba(255,79,109,.5);transform:translateY(-1px)}
.btn-ghost{background:var(--bg3);border:1px solid var(--border2);color:var(--text2)}.btn-ghost:hover{background:var(--bg4);color:var(--text);border-color:var(--border3)}
.btn-danger{background:transparent;border:1px solid rgba(248,113,113,.4);color:var(--red)}.btn-danger:hover{background:rgba(248,113,113,.08)}
.btn-block{width:100%;justify-content:center;padding:12px;font-size:14px}
.btn-sm{padding:6px 13px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important}

/* ─── HISTORY ─── */
.filter-bar{display:flex;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center}
.filter-bar select{width:auto;min-width:140px;font-size:13px;padding:8px 12px}
.sess-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem 1.25rem;margin-bottom:12px;transition:.2s}
.sess-card:hover{border-color:var(--border2);background:var(--bg3);transform:translateY(-1px)}
.sess-card.theo-sess{border-left:3px solid var(--T)}
.sess-card.nathan-sess{border-left:3px solid var(--N)}
.sess-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.badge-player{font-family:'DM Mono',monospace;font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;letter-spacing:.5px}
.badge-player.theo{background:var(--T-bg);color:var(--T2);border:1px solid var(--T3)}
.badge-player.nathan{background:var(--N-bg);color:var(--N2);border:1px solid var(--N3)}
.badge-type{font-family:'DM Mono',monospace;font-size:11px;font-weight:600;padding:4px 10px;border-radius:6px;letter-spacing:.5px}
.badge-pull{background:rgba(45,212,191,.15);color:var(--pull);border:1px solid rgba(45,212,191,.3)}
.badge-push{background:rgba(251,146,60,.15);color:var(--push);border:1px solid rgba(251,146,60,.3)}
.badge-legs{background:rgba(129,140,248,.15);color:var(--legs);border:1px solid rgba(129,140,248,.3)}
.badge-custom{background:rgba(192,132,252,.15);color:var(--custom);border:1px solid rgba(192,132,252,.3)}
.sess-date{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3)}
.sess-note{font-size:13px;color:var(--text2);font-style:italic;margin-bottom:10px;padding:8px 10px;background:var(--bg3);border-radius:6px;border-left:2px solid var(--border2)}
.ex-table{width:100%;border-collapse:collapse;font-size:13px}
.ex-table th{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);letter-spacing:.8px;text-transform:uppercase;padding:6px 10px;text-align:left;border-bottom:1px solid var(--border)}
.ex-table td{padding:6px 10px;color:var(--text2);vertical-align:middle}
.ex-table tr:hover td{color:var(--text);background:rgba(255,255,255,.02)}
.pill{display:inline-block;background:var(--bg4);border:1px solid var(--border2);border-radius:4px;padding:2px 8px;margin:2px;font-family:'DM Mono',monospace;font-size:11px;color:var(--text2)}

/* ─── STATS ─── */
.stat-tabs{display:flex;gap:4px;margin-bottom:1.5rem;background:var(--bg2);padding:5px;border-radius:var(--r-sm);border:1px solid var(--border)}
.stat-tab{flex:1;background:none;border:none;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;padding:8px 10px;border-radius:6px;cursor:pointer;transition:.15s;text-align:center}
.stat-tab.active{background:var(--bg4);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:1.5rem}
.metric{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;text-align:center;transition:.15s}
.metric:hover{border-color:var(--border2);background:var(--bg3)}
.metric .v{font-family:'Unbounded',sans-serif;font-size:32px;font-weight:900;line-height:1;margin-bottom:6px}
.metric .l{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);letter-spacing:1.2px;text-transform:uppercase}
.v-T{color:var(--T2)}.v-N{color:var(--N2)}
.bar-wrap{background:var(--bg3);border-radius:4px;height:5px;overflow:hidden;margin-top:4px}
.bar{height:100%;border-radius:4px;transition:.7s ease}
.bar-T{background:linear-gradient(90deg,var(--T),var(--T2))}.bar-N{background:linear-gradient(90deg,var(--N),var(--N2))}
.compare-row{margin-bottom:18px}
.compare-row .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;align-items:center}
.compare-row .lbl .key{color:var(--text2);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.5px;text-transform:uppercase}
.compare-bar-track{height:8px;background:var(--bg3);border-radius:6px;overflow:hidden;display:flex}
.ex-stats-table{width:100%;border-collapse:collapse;font-size:13px}
.ex-stats-table th{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);letter-spacing:.8px;text-transform:uppercase;padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
.ex-stats-table td{padding:10px 12px;color:var(--text2);border-bottom:1px solid var(--border)}
.ex-stats-table tr:hover td{color:var(--text);background:var(--bg3)}

/* ─── LAST SESSION PANEL ─── */
.last-sess{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r-sm);padding:14px;margin-bottom:18px;display:none;animation:fadeIn .25s ease}
.last-sess.visible{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.last-sess-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.last-sess-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;gap:6px;font-weight:600}
.last-sess-label i{font-size:14px}
.last-sess-date{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);background:var(--bg4);padding:3px 8px;border-radius:4px}
.last-ex{margin-bottom:10px}
.last-ex-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:5px;display:flex;align-items:center;gap:7px}
.last-ex-name .rest-tag{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);background:var(--bg4);padding:2px 8px;border-radius:3px;border:1px solid var(--border)}
.last-series{display:flex;flex-wrap:wrap;gap:5px}
.last-pill{font-family:'DM Mono',monospace;font-size:11px;background:var(--bg4);border:1px solid var(--border2);border-radius:4px;padding:3px 9px;color:var(--text2)}
.last-note{font-size:12px;font-style:italic;color:var(--text2);margin-bottom:10px;padding:8px 10px;background:var(--bg4);border-radius:6px;border-left:2px solid var(--border3)}
.last-loading{text-align:center;padding:14px;color:var(--text3);font-size:13px}
.last-loading i{animation:spin 1s linear infinite;display:inline-block;margin-right:6px}

/* ─── EMPTY / LOADING ─── */
.empty{text-align:center;padding:4rem 1rem;color:var(--text3)}
.empty i{font-size:44px;display:block;margin-bottom:14px;opacity:.3}
.empty p{font-size:14px}
.loading-wrap{text-align:center;padding:3rem;color:var(--text3)}
.loading-wrap i{font-size:28px;animation:spin 1s linear infinite;display:block;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── TOAST ─── */
#toast{position:fixed;bottom:28px;right:28px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:13px 20px;font-size:13px;font-weight:600;transform:translateY(80px);opacity:0;transition:.25s;z-index:999;display:flex;align-items:center;gap:9px;font-family:'DM Sans',sans-serif;max-width:320px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#toast.show{transform:translateY(0);opacity:1}
#toast.ok{border-color:rgba(74,222,128,.4);}
#toast.ok i{color:var(--green)}
#toast.err{border-color:rgba(248,113,113,.4);}
#toast.err i{color:var(--red)}

/* ─── CHART ─── */
.chart-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1.5rem;margin-bottom:1rem}
.chart-title{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:1.2rem;font-weight:600}
.chart-wrap{height:220px;position:relative}

/* ─── SECTION DIVIDER ─── */
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.section-head-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600}
.section-head-label.theo{color:var(--T2)}.section-head-label.nathan{color:var(--N2)}

/* ─── LIBRARY ─── */
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-top:1rem}
.lib-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:.15s}
.lib-card:hover{border-color:var(--border2);background:var(--bg3)}
.lib-name{font-size:14px;font-weight:500;color:var(--text)}
.lib-type{font-family:'DM Mono',monospace;font-size:10px;font-weight:600;padding:3px 8px;border-radius:4px;letter-spacing:.5px}
.lib-type-pull{background:rgba(45,212,191,.15);color:var(--pull)}
.lib-type-push{background:rgba(251,146,60,.15);color:var(--push)}
.lib-type-legs{background:rgba(129,140,248,.15);color:var(--legs)}
.lib-type-custom{background:rgba(192,132,252,.15);color:var(--custom)}
.lib-type-all{background:rgba(255,255,255,.08);color:var(--text2)}
.add-ex-form{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:1.25rem;margin-bottom:1.5rem}
.add-ex-form h3{font-size:14px;font-weight:600;margin-bottom:1rem;color:var(--text2)}
.add-ex-row{display:grid;grid-template-columns:1fr 160px auto;gap:10px;align-items:end}
@media(max-width:600px){.add-ex-row{grid-template-columns:1fr;}}
/* ─── EXERCISE DROPDOWN ─── */
.ex-select-wrap{position:relative;flex:1}
.ex-select-wrap select{width:100%;font-size:14px;font-weight:500;padding-right:32px}
.ex-select-wrap::after{content:'\e3d0';font-family:'tabler-icons';position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;font-size:14px}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="logo">
    <span class="t">T</span><span class="amp"> & </span><span class="n">N</span>
    <span class="logo-sub">SPORT TRACKER</span>
  </div>
  <div class="nav-links">

const S={theo:{},nathan:{}};
const RESTS=['30s','1min','1min30','2min','3min','4min'];

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

function addEx(player,data){
  const id=uid();
  S[player][id]=data?{...JSON.parse(JSON.stringify(data)),_id:id}:{_id:id,name:'',rest:'',series:[]};
  renderExList(player);
}
function delEx(player,id){delete S[player][id];renderExList(player);}
function addSerie(player,id){S[player][id].series.push({reps:'',wt:''});renderExList(player);}
function delSerie(player,id,i){S[player][id].series.splice(i,1);renderExList(player);}
function setRest(player,id,val){S[player][id].rest=val;renderExList(player);}

function renderExList(player){
  const cont=document.getElementById(player+'-ex-list');
  cont.innerHTML='';
  const entries=Object.entries(S[player]);
  entries.forEach(([id,ex],exIdx)=>{
    const div=document.createElement('div');
    div.className='ex-item';
    const seriesHtml=ex.series.map((s,i)=>`
      <div class="serie-row">
        <span class="sn">${i+1}</span>
        <input type="number" class="reps" min="0" value="${s.reps}" placeholder="—"
          oninput="S['${player}']['${id}'].series[${i}].reps=this.value">
        <span class="x">×</span>
        <input type="text" class="wt" value="${s.wt}" placeholder="—"
          oninput="S['${player}']['${id}'].series[${i}].wt=this.value">
        <span class="kg">kg</span>
        <button class="btn-icon del" onclick="delSerie('${player}','${id}',${i})"><i class="ti ti-x" style="font-size:11px"></i></button>
      </div>`).join('');
    const chipsHtml=RESTS.map(r=>`<span class="chip${ex.rest===r?' on':''}" onclick="setRest('${player}','${id}','${r}')">${r}</span>`).join('');
    const libOptions = getLibForType(picked[player]);
    const optionsHtml = `<option value="">-- Choisir un exercice --</option>`
      + libOptions.map(e=>`<option value="${e.name}"${ex.name===e.name?' selected':''}>${e.name}</option>`).join('')
      + (ex.name && !libOptions.find(e=>e.name===ex.name) ? `<option value="${ex.name}" selected>${ex.name} (manuel)</option>` : '');
    div.innerHTML=`
      <div class="ex-top">
        <span class="ex-num">${String(exIdx+1).padStart(2,'0')}</span>
        <div class="ex-select-wrap">
          <select onchange="S['${player}']['${id}'].name=this.value;renderExList('${player}')">${optionsHtml}</select>
        </div>
        <button class="btn-icon" onclick="delEx('${player}','${id}')"><i class="ti ti-trash" style="color:var(--red)"></i></button>
      </div>
      <div class="rest-row">
        <div style="font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:5px">Repos</div>
        <div class="rest-chips">
          ${chipsHtml}
          <input class="chip-input" type="text" placeholder="autre" value="${RESTS.includes(ex.rest)?'':ex.rest}"
            oninput="setRest('${player}','${id}',this.value)">
        </div>
      </div>
      <div>
        <div class="series-lbl">
          <span>Séries</span>
          <button class="btn btn-ghost btn-sm" style="padding:2px 8px;font-size:11px" onclick="addSerie('${player}','${id}')"><i class="ti ti-plus"></i> Série</button>
        </div>
        <div class="series-grid">${seriesHtml}</div>
      </div>`;
    cont.appendChild(div);
  });
}

// ─── TYPE PICKER ──────────────────────────────────────────────────────────────
const picked={theo:'',nathan:''};

      panel.innerHTML=`<div class="last-sess-header"><span class="last-sess-label"><i class="ti ti-clock-off"></i>Aucune séance ${type} précédente</span></div>`;

function applyTemplate(player){
  const t=picked[player]||'pull';
  const tpl=TPLS[t]||TPLS.pull;
  S[player]={};
  tpl.forEach(ex=>addEx(player,ex));
  if(!picked[player]){
    picked[player]='pull';
    document.querySelector(`.type-btn[data-p="${player}"][data-t="pull"]`).className='type-btn sel-pull';
  }

// ─── SAVE SESSION ─────────────────────────────────────────────────────────────
async function saveSession(player){
  const btn=document.getElementById('btn-save-'+player);
  const date=document.getElementById(player+'-date').value||today();
  const type=picked[player];
  const note=document.getElementById(player+'-note').value.trim();
  if(!type){toast('Choisis un type de séance','err');return;}
  const exercises=Object.values(S[player])
    .filter(e=>e.name.trim())
    .map(e=>({name:e.name,rest:e.rest,series:e.series.filter(s=>s.reps||s.wt)}));
  if(!exercises.length){toast('Ajoute au moins un exercice','err');return;}
  btn.disabled=true;setStatus('loading','Enregistrement…');
  try{
    await sbInsert({player,date,type,note,exercises});
    S[player]={};renderExList(player);
    document.getElementById(player+'-note').value='';
    picked[player]='';
    document.querySelectorAll(`.type-btn[data-p="${player}"]`).forEach(b=>b.className='type-btn');
    document.getElementById(player+'-date').value=today();
    document.getElementById('last-'+player).className='last-sess';
    setStatus('ok','Connecté à Supabase');
    toast('Séance enregistrée !');
  }catch(e){
    setStatus('err','Erreur sauvegarde');
    toast('Erreur : '+e.message,'err');
  }finally{btn.disabled=false;}
}

// ─── HISTORY ─────────────────────────────────────────────────────────────────
async function loadHistory(){
  const wrap=document.getElementById('history-wrap');
  wrap.innerHTML=`<div class="loading-wrap"><i class="ti ti-loader-2"></i><p>Chargement…</p></div>`;
  const fp=document.getElementById('f-player').value;
  const ft=document.getElementById('f-type').value;
  let q='';
  if(fp!=='all')q+=`player=eq.${fp}&`;
  if(ft!=='all')q+=`type=eq.${ft}&`;
  try{
    const data=await sbGet(q.slice(0,-1));
    if(!data.length){wrap.innerHTML=`<div class="empty"><i class="ti ti-barbell"></i><p>Aucune séance enregistrée</p></div>`;return;}
    wrap.innerHTML=data.map(s=>{
      const exRows=s.exercises.map(e=>{
        const pills=e.series.map(sr=>`<span class="pill">${sr.reps||'—'}${sr.wt?'×'+sr.wt+'kg':''}</span>`).join('');
        return`<tr><td style="color:var(--text)">${e.name}</td><td style="font-family:'DM Mono',monospace;font-size:10px">${e.rest||'—'}</td><td>${pills}</td></tr>`;
      }).join('');
      return`<div class="sess-card ${s.player}-sess">
        <div class="sess-head">
          <span class="badge-player ${s.player}">${s.player==='theo'?'THÉO':'NATHAN'}</span>
          <span class="badge-type badge-${s.type}">${s.type.toUpperCase()}</span>
          <span class="sess-date"><i class="ti ti-calendar" style="font-size:12px;vertical-align:-2px;margin-right:3px"></i>${fmtDate(s.date)}</span>
          <button class="btn-icon" style="margin-left:auto" onclick="deleteSession('${s.id}')" title="Supprimer"><i class="ti ti-trash" style="color:var(--text3)"></i></button>
        </div>
        ${s.note?`<div class="sess-note">"${s.note}"</div>`:''}
        <table class="ex-table"><thead><tr><th>Exercice</th><th>Repos</th><th>Séries</th></tr></thead><tbody>${exRows}</tbody></table>
      </div>`;
    }).join('');
  }catch(e){
    wrap.innerHTML=`<div class="empty"><i class="ti ti-wifi-off"></i><p>Erreur chargement : ${e.message}</p></div>`;
  }
}

async function deleteSession(id){
  if(!confirm('Supprimer cette séance ?'))return;
  try{
    await sbDelete(id);
    toast('Séance supprimée');
    loadHistory();
  }catch(e){toast('Erreur suppression','err');}
}

  try{allSessions=await sbGet('');}
  catch(e){allSessions=[];}
}

function calcP(player){
  const ss=allSessions.filter(s=>s.player===player);
  const sets=ss.reduce((a,s)=>a+s.exercises.reduce((b,e)=>b+e.series.length,0),0);
  const reps=ss.reduce((a,s)=>a+s.exercises.reduce((b,e)=>b+e.series.reduce((c,sr)=>c+(parseInt(sr.reps)||0),0),0),0);
  const bt={pull:0,push:0,legs:0,custom:0};
  ss.forEach(s=>bt[s.type]=(bt[s.type]||0)+1);
  return{count:ss.length,sets,reps,bt,sessions:ss};
}

// Formatte une Date locale en "YYYY-MM-DD" sans passer par UTC
function localISO(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const dd=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}

function getMondayOfWeek(date){
  const d = new Date(date);
  d.setHours(0,0,0,0);
  const day = d.getDay(); // 0=Sun, 1=Mon, ... 6=Sat
  const diff = (day === 0) ? -6 : 1 - day; // lundi = ref
  d.setDate(d.getDate() + diff);
  return d;
}

function buildActivityChart(){
  const ctx=document.getElementById('act-chart');if(!ctx)return;
  if(_chart){_chart.destroy();_chart=null;}

  // 8 semaines fixes lundi→dimanche en heure locale (pas UTC)
  const today = new Date();
  const currentMonday = getMondayOfWeek(today);
  const weeks = [];
  for(let i=7; i>=0; i--){
    const mon = new Date(currentMonday);
    mon.setDate(mon.getDate() - i*7);
    const sun = new Date(mon);
    sun.setDate(sun.getDate() + 6);
    weeks.push({
      from:  localISO(mon),   // "YYYY-MM-DD" en heure locale
      to:    localISO(sun),
      label: `${mon.getDate()}/${mon.getMonth()+1}`
    });
  }

  const types      = ['pull','push','legs','custom'];
  const typeLabels = {pull:'Pull', push:'Push', legs:'Legs', custom:'Custom'};

  // Index 0 = Théo (couleur vive), Index 1 = Nathan (même teinte, transparente)
  const typeColors = {
    pull:   ['rgba(45,212,191,1)',  'rgba(45,212,191,.45)'],
    push:   ['rgba(251,146,60,1)',  'rgba(251,146,60,.45)'],
    legs:   ['rgba(129,140,248,1)', 'rgba(129,140,248,.45)'],
    custom: ['rgba(192,132,252,1)', 'rgba(192,132,252,.45)'],
  };

  // Ordre des datasets : tous les types de Théo en premier, puis tous ceux de Nathan.
  // Cela garantit que l’ordre d’empilement (pull bas → custom haut) est identique
  // dans les deux barres et colle exactement à la légende.
  const datasets = [];
  ['theo','nathan'].forEach((player, pi) => {
    types.forEach(type => {
      datasets.push({
        label:           `${pi===0?'Théo':'Nathan'} — ${typeLabels[type]}`,
        data:            weeks.map(w =>
          allSessions.filter(s =>
            s.player===player && s.type===type &&
            s.date >= w.from  && s.date <= w.to
          ).length
        ),
        backgroundColor: typeColors[type][pi],
        borderWidth:     0,
        borderRadius:    3,
        borderSkipped:   'bottom',
        stack:           player,  // une colonne par joueur, empilée par type
      });
    });
  });

  _chart = new Chart(ctx, {
    type: 'bar',
    data: {labels: weeks.map(w => w.label), datasets},
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display: true,
          position: 'bottom',
          labels: {
            color: '#b0b8e0',
            font: {size:11},
            boxWidth: 12,
            padding: 14,
            // Légende manuelle : une entrée par type, couleur = version Théo (vive)
            generateLabels: () => types.map(t => ({
              text:        typeLabels[t],
              fillStyle:   typeColors[t][0],
              strokeStyle: 'transparent',
              lineWidth:   0,
              hidden:      false,
            }))
          }
        },
        tooltip: {
          mode: 'index',
          intersect: false,
          callbacks: {
            title: (items) => {
              const w = weeks[items[0].dataIndex];
              // Affiche "Lun 19/05 → Dim 25/05"
              const fmt = s => `${s.slice(8)}/${s.slice(5,7)}`;
              return `Sem. du lun. ${fmt(w.from)} au dim. ${fmt(w.to)}`;
            },
            label: (item) => {
              if(item.parsed.y === 0) return null;
              return ` ${item.dataset.label} : ${item.parsed.y} séance${item.parsed.y>1?'s':''}`;
            }
          },
          filter: (item) => item.parsed.y > 0,
        }
      },
      scales: {
        x: {
          stacked: true,
          ticks: {color:'#7078a8', font:{size:10}},
          grid:  {color:'rgba(255,255,255,.03)'},
        },
        y: {
          stacked: true,
          ticks: {color:'#7078a8', stepSize:1, font:{size:10}, precision:0},
          grid:  {color:'rgba(255,255,255,.06)'},
          min: 0,
        }
      }
    }
  });
}

function renderExercises(){
  const map={};
  allSessions.forEach(s=>{
    s.exercises.forEach(e=>{
      const k=e.name.trim().toLowerCase();
      if(!map[k])map[k]={name:e.name,theo:0,nathan:0,maxW:0,reps:0};
      map[k][s.player]++;
      e.series.forEach(sr=>{
        const w=parseFloat(sr.wt)||0;
        if(w>map[k].maxW)map[k].maxW=w;
        map[k].reps+=parseInt(sr.reps)||0;
      });
    });
  });
  const rows=Object.values(map).sort((a,b)=>(b.theo+b.nathan)-(a.theo+a.nathan)).slice(0,20);
  const el=document.getElementById('stat-exercises');
  if(!rows.length){el.innerHTML=`<div class="empty"><i class="ti ti-dumbbell"></i><p>Aucun exercice</p></div>`;return;}
  el.innerHTML=`<div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden">
    <table class="ex-stats-table">
      <thead><tr>
        <th>Exercice</th>

}


// ─── EXERCISE LIBRARY ─────────────────────────────────────────────────────────────────────────────
let libCache = [];
let libFilter = 'all';

async function fetchLibrary(){
  try{
    const r = await fetch(`${SUPA_URL}/rest/v1/exercises_library?order=name.asc`,{headers:{...HDR,'Prefer':'return=representation'}});
    if(!r.ok) throw new Error(await r.text());
    libCache = await r.json();
  } catch(e){ libCache=[]; toast('Erreur chargement bibliothèque','err'); }
}

async function loadLibrary(){
  await fetchLibrary();
  renderLibrary();
}

function filterLib(f, btn){
  libFilter = f;
  document.querySelectorAll('.lib-filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderLibrary();
}

function renderLibrary(){
  const filtered = libFilter==='all'
    ? libCache
    : libCache.filter(e=>e.type===libFilter);
  const el = document.getElementById('lib-list');
  if(!filtered.length){ el.innerHTML=`<div class="empty"><i class="ti ti-dumbbell"></i><p>Aucun exercice dans cette catégorie</p></div>`; return; }
  el.innerHTML = `<div class="lib-grid">${filtered.map(e=>`
    <div class="lib-card">
      <div>
        <div class="lib-name">${e.name}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="lib-type lib-type-${e.type}">${e.type==='all'?'Toutes':e.type.toUpperCase()}</span>
        <button class="btn-icon" onclick="deleteLibExercise('${e.id}','${e.name.replace(/'/g,"\'")}')"><i class="ti ti-trash" style="color:var(--text3);font-size:14px"></i></button>
      </div>
    </div>`).join('')}</div>`;
}

async function addLibraryExercise(){
  const name = document.getElementById('new-ex-name').value.trim();
  const type = document.getElementById('new-ex-type').value;
  if(!name){ toast('Saisis un nom d’exercice','err'); return; }
  if(libCache.find(e=>e.name.toLowerCase()===name.toLowerCase())){ toast('Exercice déjà dans la bibliothèque','err'); return; }
  try{
    const r = await fetch(`${SUPA_URL}/rest/v1/exercises_library`,{method:'POST',headers:{...HDR,'Prefer':'return=representation'},body:JSON.stringify({name,type})});
    if(!r.ok) throw new Error(await r.text());
    document.getElementById('new-ex-name').value='';
    toast('Exercice ajouté !');
    await loadLibrary();
  } catch(e){ toast('Erreur : '+e.message,'err'); }
}

async function deleteLibExercise(id, name){
  if(!confirm(`Supprimer "${name}" de la bibliothèque ?`)) return;
  try{
    const r = await fetch(`${SUPA_URL}/rest/v1/exercises_library?id=eq.${id}`,{method:'DELETE',headers:HDR});
    if(!r.ok) throw new Error(await r.text());
    toast('Exercice supprimé');
    await loadLibrary();
  } catch(e){ toast('Erreur suppression','err'); }
}

// Preload library on startup for dropdowns
fetchLibrary();

// Get exercises filtered for a given session type (includes 'all' type)
function getLibForType(type){
  if(!type) return libCache;
  return libCache.filter(e=>e.type===type||e.type==='all');
}
