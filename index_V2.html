<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T & N — Sport Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Unbounded:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080809;--bg2:#0f0f12;--bg3:#161619;--bg4:#1e1e23;--bg5:#26262d;
  --border:#1e1e26;--border2:#2a2a34;--border3:#383845;
  --text:#dddde8;--text2:#8888a0;--text3:#4a4a60;
  --T:#6c63ff;--T2:#9690ff;--T3:#2a2660;
  --N:#ff4f6d;--N2:#ff8096;--N3:#5c1525;
  --pull:#3dd6c0;--push:#f5a623;--legs:#7b9cff;--custom:#d084fc;
  --green:#3ddc84;--yellow:#f5c842;--red:#ff4f6d;
  --r:10px;--r-sm:6px;--r-lg:16px;
}

body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* ─── GRAIN OVERLAY ─── */
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.5}

/* ─── NAV ─── */
nav{position:sticky;top:0;z-index:100;background:rgba(8,8,9,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 2rem;height:58px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:900;letter-spacing:1px;display:flex;align-items:center;gap:10px}
.logo .t{color:var(--T2)}.logo .amp{color:var(--text3);font-weight:400}.logo .n{color:var(--N2)}
.logo-sub{font-family:'DM Mono',monospace;font-size:10px;font-weight:400;color:var(--text3);letter-spacing:2px;margin-left:4px;margin-top:2px}
.nav-links{display:flex;gap:2px}
.nav-btn{background:none;border:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;color:var(--text2);padding:7px 14px;border-radius:var(--r-sm);cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px}
.nav-btn:hover{color:var(--text);background:var(--bg3)}
.nav-btn.active{color:var(--text);background:var(--bg3)}
.nav-btn i{font-size:15px}

/* ─── STATUS BAR ─── */
#status-bar{height:32px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 2rem;gap:8px;font-family:'DM Mono',monospace;font-size:11px;color:var(--text3)}
#status-dot{width:6px;height:6px;border-radius:50%;background:var(--text3);transition:.3s}
#status-dot.ok{background:var(--green);box-shadow:0 0 6px var(--green)}
#status-dot.err{background:var(--red)}
#status-dot.loading{background:var(--yellow);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ─── PAGES ─── */
.page{display:none;position:relative;z-index:1}.page.active{display:block}
.page-inner{max-width:1080px;margin:0 auto;padding:2rem}

/* ─── PAGE HEADER ─── */
.page-title{font-family:'Unbounded',sans-serif;font-size:20px;font-weight:700;letter-spacing:-.3px;margin-bottom:2rem}
.page-title span{color:var(--text3);font-weight:400;font-size:14px;font-family:'DM Mono',monospace;display:block;margin-top:4px;letter-spacing:1px}

/* ─── DUAL GRID ─── */
.dual{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem}
@media(max-width:720px){.dual{grid-template-columns:1fr}}

/* ─── PLAYER CARD ─── */
.player-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;transition:.2s}
.player-card:focus-within{border-color:var(--border2)}
.player-header{padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.player-name{font-family:'Unbounded',sans-serif;font-size:14px;font-weight:700;letter-spacing:.5px}
.player-name.theo{color:var(--T2)}.player-name.nathan{color:var(--N2)}
.player-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Unbounded',sans-serif;font-size:12px;font-weight:700}
.player-avatar.theo{background:var(--T3);color:var(--T2)}
.player-avatar.nathan{background:var(--N3);color:var(--N2)}
.player-body{padding:1.25rem 1.5rem}

/* ─── FORM ─── */
.fg{margin-bottom:16px}
.fg label{display:block;font-family:'DM Mono',monospace;font-size:10px;font-weight:500;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r-sm);
  color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:9px 12px;outline:none;transition:.15s;
  -webkit-appearance:none;appearance:none
}
input:focus,select:focus{border-color:var(--border3);background:var(--bg4)}
select option{background:var(--bg3)}

/* ─── TYPE SELECTOR ─── */
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.type-btn{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r-sm);padding:10px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px;font-family:'DM Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.5px;color:var(--text2)}
.type-btn:hover{background:var(--bg4);color:var(--text);border-color:var(--border3)}
.type-btn.sel-pull{background:rgba(61,214,192,.1);border-color:rgba(61,214,192,.3);color:var(--pull)}
.type-btn.sel-push{background:rgba(245,166,35,.1);border-color:rgba(245,166,35,.3);color:var(--push)}
.type-btn.sel-legs{background:rgba(123,156,255,.1);border-color:rgba(123,156,255,.3);color:var(--legs)}
.type-btn.sel-custom{background:rgba(208,132,252,.1);border-color:rgba(208,132,252,.3);color:var(--custom)}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-pull{background:var(--pull)}.dot-push{background:var(--push)}.dot-legs{background:var(--legs)}.dot-custom{background:var(--custom)}

/* ─── EXERCISE BUILDER ─── */
.ex-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.ex-item{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r-sm);padding:12px}
.ex-top{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.ex-top input{flex:1;font-size:13px}
.ex-num{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);min-width:18px}
.btn-icon{background:none;border:none;cursor:pointer;color:var(--text3);padding:4px;border-radius:4px;line-height:1;transition:.15s;display:inline-flex;align-items:center}
.btn-icon:hover{color:var(--text);background:var(--bg5)}
.rest-row{margin-bottom:10px}
.rest-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{background:var(--bg4);border:1px solid var(--border2);border-radius:20px;padding:3px 10px;font-family:'DM Mono',monospace;font-size:11px;color:var(--text2);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--border3);color:var(--text)}
.chip.on{background:var(--bg5);border-color:var(--border3);color:var(--text)}
.chip-input{background:var(--bg4);border:1px solid var(--border2);border-radius:20px;padding:3px 10px;font-family:'DM Mono',monospace;font-size:11px;color:var(--text2);width:70px;text-align:center;outline:none}
.chip-input:focus{border-color:var(--border3)}
.series-lbl{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.series-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:5px}
.serie-row{display:flex;align-items:center;gap:3px;background:var(--bg4);border:1px solid var(--border);border-radius:5px;padding:5px 8px}
.serie-row .sn{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);min-width:14px}
.serie-row input{background:none;border:none;font-family:'DM Mono',monospace;font-size:12px;color:var(--text);text-align:center;padding:0;outline:none}
.serie-row input.reps{width:34px}
.serie-row input.wt{width:38px}
.serie-row .x{color:var(--text3);font-size:11px;padding:0 1px}
.serie-row .kg{color:var(--text3);font-size:10px}
.serie-row .del{margin-left:auto}

/* ─── BUTTONS ─── */
.btn{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;padding:9px 20px;border-radius:var(--r-sm);cursor:pointer;border:none;transition:.15s;display:inline-flex;align-items:center;gap:7px;letter-spacing:.1px}
.btn-T{background:var(--T);color:#fff}.btn-T:hover{background:var(--T2)}
.btn-N{background:var(--N);color:#fff}.btn-N:hover{background:var(--N2)}
.btn-ghost{background:var(--bg3);border:1px solid var(--border2);color:var(--text2)}.btn-ghost:hover{background:var(--bg4);color:var(--text);border-color:var(--border3)}
.btn-danger{background:transparent;border:1px solid rgba(255,79,109,.3);color:var(--red)}.btn-danger:hover{background:rgba(255,79,109,.08)}
.btn-block{width:100%;justify-content:center}
.btn-sm{padding:5px 12px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ─── HISTORY ─── */
.filter-bar{display:flex;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap}
.filter-bar select{width:auto;min-width:130px;font-size:12px;padding:7px 10px}
.sess-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.25rem;margin-bottom:10px;transition:.15s}
.sess-card:hover{border-color:var(--border2)}
.sess-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.badge-player{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;padding:3px 10px;border-radius:20px;letter-spacing:.5px}
.badge-player.theo{background:var(--T3);color:var(--T2)}
.badge-player.nathan{background:var(--N3);color:var(--N2)}
.badge-type{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;padding:3px 8px;border-radius:4px;letter-spacing:.5px}
.badge-pull{background:rgba(61,214,192,.12);color:var(--pull)}
.badge-push{background:rgba(245,166,35,.12);color:var(--push)}
.badge-legs{background:rgba(123,156,255,.12);color:var(--legs)}
.badge-custom{background:rgba(208,132,252,.12);color:var(--custom)}
.sess-date{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3)}
.sess-note{font-size:12px;color:var(--text2);font-style:italic;margin-bottom:10px;padding-left:2px}
.ex-table{width:100%;border-collapse:collapse;font-size:12px}
.ex-table th{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);letter-spacing:.8px;text-transform:uppercase;padding:4px 8px;text-align:left;border-bottom:1px solid var(--border)}
.ex-table td{padding:5px 8px;color:var(--text2);vertical-align:middle}
.ex-table tr:hover td{color:var(--text)}
.pill{display:inline-block;background:var(--bg4);border:1px solid var(--border);border-radius:3px;padding:1px 6px;margin:1px;font-family:'DM Mono',monospace;font-size:10px;color:var(--text2)}

/* ─── STATS ─── */
.stat-tabs{display:flex;gap:4px;margin-bottom:1.5rem;background:var(--bg2);padding:4px;border-radius:var(--r-sm);border:1px solid var(--border)}
.stat-tab{flex:1;background:none;border:none;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;padding:7px 8px;border-radius:6px;cursor:pointer;transition:.15s;text-align:center}
.stat-tab.active{background:var(--bg4);color:var(--text)}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1.5rem}
.metric{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;text-align:center}
.metric .v{font-family:'Unbounded',sans-serif;font-size:28px;font-weight:900;line-height:1;margin-bottom:6px}
.metric .l{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);letter-spacing:1px;text-transform:uppercase}
.v-T{color:var(--T2)}.v-N{color:var(--N2)}
.bar-wrap{background:var(--bg3);border-radius:4px;height:5px;overflow:hidden;margin-top:4px}
.bar{height:100%;border-radius:4px;transition:.7s ease}
.bar-T{background:var(--T)}.bar-N{background:var(--N)}
.compare-row{margin-bottom:14px}
.compare-row .lbl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.compare-row .lbl .key{color:var(--text2);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.3px}
.compare-bar-track{height:6px;background:var(--bg3);border-radius:4px;overflow:hidden;display:flex}
.ex-stats-table{width:100%;border-collapse:collapse;font-size:12px}
.ex-stats-table th{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);letter-spacing:.8px;text-transform:uppercase;padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
.ex-stats-table td{padding:8px 10px;color:var(--text2);border-bottom:1px solid var(--border)}
.ex-stats-table tr:hover td{color:var(--text);background:var(--bg3)}

/* ─── LAST SESSION PANEL ─── */
.last-sess{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r-sm);padding:12px;margin-bottom:16px;display:none;animation:fadeIn .25s ease}
.last-sess.visible{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.last-sess-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.last-sess-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);display:flex;align-items:center;gap:6px}
.last-sess-label i{font-size:13px}
.last-sess-date{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3)}
.last-ex{margin-bottom:8px}
.last-ex-name{font-size:12px;font-weight:500;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.last-ex-name .rest-tag{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);background:var(--bg4);padding:1px 6px;border-radius:3px}
.last-series{display:flex;flex-wrap:wrap;gap:4px}
.last-pill{font-family:'DM Mono',monospace;font-size:11px;background:var(--bg4);border:1px solid var(--border);border-radius:3px;padding:2px 8px;color:var(--text2)}
.last-note{font-size:11px;font-style:italic;color:var(--text3);margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.last-loading{text-align:center;padding:12px;color:var(--text3);font-size:12px}
.last-loading i{animation:spin 1s linear infinite;display:inline-block;margin-right:6px}

/* ─── EMPTY / LOADING ─── */
.empty{text-align:center;padding:4rem 1rem;color:var(--text3)}
.empty i{font-size:40px;display:block;margin-bottom:12px;opacity:.4}
.empty p{font-size:14px}
.loading-wrap{text-align:center;padding:3rem;color:var(--text3)}
.loading-wrap i{font-size:28px;animation:spin 1s linear infinite;display:block;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── TOAST ─── */
#toast{position:fixed;bottom:28px;right:28px;background:var(--bg3);border:1px solid var(--border3);border-radius:var(--r);padding:12px 20px;font-size:13px;font-weight:500;transform:translateY(80px);opacity:0;transition:.25s;z-index:999;display:flex;align-items:center;gap:8px;font-family:'DM Sans',sans-serif;max-width:320px}
#toast.show{transform:translateY(0);opacity:1}
#toast.ok i{color:var(--green)}
#toast.err i{color:var(--red)}

/* ─── CHART ─── */
.chart-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem;margin-bottom:1rem}
.chart-title{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:1rem}
.chart-wrap{height:180px;position:relative}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="logo">
    <span class="t">T</span><span class="amp"> & </span><span class="n">N</span>
    <span class="logo-sub">SPORT TRACKER</span>
  </div>
  <div class="nav-links">
    <button class="nav-btn active" onclick="showPage('log')"><i class="ti ti-plus"></i> Séance</button>
    <button class="nav-btn" onclick="showPage('history')"><i class="ti ti-history"></i> Historique</button>
    <button class="nav-btn" onclick="showPage('stats')"><i class="ti ti-chart-bar"></i> Stats</button>
  </div>
</nav>

<!-- STATUS BAR -->
<div id="status-bar">
  <div id="status-dot"></div>
  <span id="status-text">Connexion à Supabase…</span>
</div>

<!-- PAGE: LOG -->
<div id="page-log" class="page active">
  <div class="page-inner">
    <div class="page-title">Nouvelle séance <span>LOG / RECORD</span></div>
    <div class="dual">
      <!-- THÉO -->
      <div class="player-card" id="card-theo">
        <div class="player-header">
          <div class="player-avatar theo">T</div>
          <div class="player-name theo">THÉO</div>
          <button class="btn btn-ghost btn-sm" onclick="applyTemplate('theo')"><i class="ti ti-template"></i> Template</button>
        </div>
        <div class="player-body">
          <div class="fg"><label>Date</label><input type="date" id="theo-date"></div>
          <div class="fg">
            <label>Type de séance</label>
            <div class="type-grid">
              <button class="type-btn" data-p="theo" data-t="pull" onclick="pickType('theo','pull',this)"><span class="dot dot-pull"></span>PULL</button>
              <button class="type-btn" data-p="theo" data-t="push" onclick="pickType('theo','push',this)"><span class="dot dot-push"></span>PUSH</button>
              <button class="type-btn" data-p="theo" data-t="legs" onclick="pickType('theo','legs',this)"><span class="dot dot-legs"></span>LEGS</button>
              <button class="type-btn" data-p="theo" data-t="custom" onclick="pickType('theo','custom',this)"><span class="dot dot-custom"></span>CUSTOM</button>
            </div>
          </div>
          <div id="last-theo" class="last-sess"></div>
          <div class="fg"><label>Note</label><input type="text" id="theo-note" placeholder="RPE, ressenti..."></div>
          <div class="fg">
            <label>Exercices</label>
            <div id="theo-ex-list" class="ex-list"></div>
            <button class="btn btn-ghost btn-sm" style="margin-top:4px" onclick="addEx('theo')"><i class="ti ti-plus"></i> Exercice</button>
          </div>
          <button class="btn btn-T btn-block" id="btn-save-theo" onclick="saveSession('theo')"><i class="ti ti-device-floppy"></i> Enregistrer</button>
        </div>
      </div>

      <!-- NATHAN -->
      <div class="player-card" id="card-nathan">
        <div class="player-header">
          <div class="player-avatar nathan">N</div>
          <div class="player-name nathan">NATHAN</div>
          <button class="btn btn-ghost btn-sm" onclick="applyTemplate('nathan')"><i class="ti ti-template"></i> Template</button>
        </div>
        <div class="player-body">
          <div class="fg"><label>Date</label><input type="date" id="nathan-date"></div>
          <div class="fg">
            <label>Type de séance</label>
            <div class="type-grid">
              <button class="type-btn" data-p="nathan" data-t="pull" onclick="pickType('nathan','pull',this)"><span class="dot dot-pull"></span>PULL</button>
              <button class="type-btn" data-p="nathan" data-t="push" onclick="pickType('nathan','push',this)"><span class="dot dot-push"></span>PUSH</button>
              <button class="type-btn" data-p="nathan" data-t="legs" onclick="pickType('nathan','legs',this)"><span class="dot dot-legs"></span>LEGS</button>
              <button class="type-btn" data-p="nathan" data-t="custom" onclick="pickType('nathan','custom',this)"><span class="dot dot-custom"></span>CUSTOM</button>
            </div>
          </div>
          <div id="last-nathan" class="last-sess"></div>
          <div class="fg"><label>Note</label><input type="text" id="nathan-note" placeholder="RPE, ressenti..."></div>
          <div class="fg">
            <label>Exercices</label>
            <div id="nathan-ex-list" class="ex-list"></div>
            <button class="btn btn-ghost btn-sm" style="margin-top:4px" onclick="addEx('nathan')"><i class="ti ti-plus"></i> Exercice</button>
          </div>
          <button class="btn btn-N btn-block" id="btn-save-nathan" onclick="saveSession('nathan')"><i class="ti ti-device-floppy"></i> Enregistrer</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- PAGE: HISTORY -->
<div id="page-history" class="page">

const HDR = {'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY};

async function sbGet(query=''){
  const r=await fetch(`${SUPA_URL}/rest/v1/sessions?${query}&order=date.desc,created_at.desc`,{headers:{...HDR,'Prefer':'return=representation'}});
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}
async function sbInsert(data){
  const r=await fetch(`${SUPA_URL}/rest/v1/sessions`,{method:'POST',headers:{...HDR,'Prefer':'return=representation'},body:JSON.stringify(data)});
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}
async function sbDelete(id){
  const r=await fetch(`${SUPA_URL}/rest/v1/sessions?id=eq.${id}`,{method:'DELETE',headers:HDR});
  if(!r.ok)throw new Error(await r.text());
}

function setStatus(state,msg){

  const txt=document.getElementById('status-text');
  dot.className=state;txt.textContent=msg;
}

// ─── UTILS ────────────────────────────────────────────────────────────────────
function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(d){if(!d)return'';const[y,m,dd]=d.split('-');return`${dd}/${m}/${y}`}
let _chart=null;

function toast(msg,type='ok'){
  const el=document.getElementById('toast');
  const i=el.querySelector('i');
  document.getElementById('toast-msg').textContent=msg;
  i.className=type==='ok'?'ti ti-check':'ti ti-alert-circle';
  el.className='show '+(type==='ok'?'ok':'err');
  clearTimeout(el._t);el._t=setTimeout(()=>el.className='',2500);
}

// ─── NAV ─────────────────────────────────────────────────────────────────────
function showPage(p){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  const idx={log:0,history:1,stats:2}[p];
  document.querySelectorAll('.nav-btn')[idx].classList.add('active');
  if(p==='history')loadHistory();
  if(p==='stats')renderStats('overview');
}

// ─── EXERCISE STATE ───────────────────────────────────────────────────────────
const S={theo:{},nathan:{}};
const RESTS=['30s','1min','1min30','2min','3min','4min'];

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

function addEx(player,data){
  const id=uid();
  S[player][id]=data?{...JSON.parse(JSON.stringify(data)),_id:id}:{_id:id,name:'',rest:'',series:[]};
  renderExList(player);
}
function delEx(player,id){delete S[player][id];renderExList(player);}
function addSerie(player,id){S[player][id].series.push({reps:'',wt:''});renderExList(player);}
function delSerie(player,id,i){S[player][id].series.splice(i,1);renderExList(player);}
function setRest(player,id,val){S[player][id].rest=val;renderExList(player);}

function renderExList(player){
  const cont=document.getElementById(player+'-ex-list');
  cont.innerHTML='';
  const entries=Object.entries(S[player]);
  entries.forEach(([id,ex],exIdx)=>{
    const div=document.createElement('div');
    div.className='ex-item';
    const seriesHtml=ex.series.map((s,i)=>`
      <div class="serie-row">
        <span class="sn">${i+1}</span>
        <input type="number" class="reps" min="0" value="${s.reps}" placeholder="—"
          oninput="S['${player}']['${id}'].series[${i}].reps=this.value">
        <span class="x">×</span>
        <input type="text" class="wt" value="${s.wt}" placeholder="—"
          oninput="S['${player}']['${id}'].series[${i}].wt=this.value">
        <span class="kg">kg</span>
        <button class="btn-icon del" onclick="delSerie('${player}','${id}',${i})"><i class="ti ti-x" style="font-size:11px"></i></button>
      </div>`).join('');
    const chipsHtml=RESTS.map(r=>`<span class="chip${ex.rest===r?' on':''}" onclick="setRest('${player}','${id}','${r}')">${r}</span>`).join('');
    div.innerHTML=`
      <div class="ex-top">
        <span class="ex-num">${String(exIdx+1).padStart(2,'0')}</span>
        <input type="text" value="${ex.name}" placeholder="Nom exercice"
          oninput="S['${player}']['${id}'].name=this.value">
        <button class="btn-icon" onclick="delEx('${player}','${id}')"><i class="ti ti-trash" style="color:var(--red)"></i></button>
      </div>
      <div class="rest-row">
        <div style="font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:5px">Repos</div>
        <div class="rest-chips">
          ${chipsHtml}
          <input class="chip-input" type="text" placeholder="autre" value="${RESTS.includes(ex.rest)?'':ex.rest}"
            oninput="setRest('${player}','${id}',this.value)">
        </div>
      </div>
      <div>
        <div class="series-lbl">
          <span>Séries</span>
          <button class="btn btn-ghost btn-sm" style="padding:2px 8px;font-size:11px" onclick="addSerie('${player}','${id}')"><i class="ti ti-plus"></i> Série</button>
        </div>
        <div class="series-grid">${seriesHtml}</div>
      </div>`;
    cont.appendChild(div);
  });
}

// ─── TYPE PICKER ──────────────────────────────────────────────────────────────
const picked={theo:'',nathan:''};
function pickType(player,type,btn){
  picked[player]=type;
  document.querySelectorAll(`.type-btn[data-p="${player}"]`).forEach(b=>b.className='type-btn');
  btn.className=`type-btn sel-${type}`;
  loadLastSession(player,type);
}

async function loadLastSession(player,type){
  const panel=document.getElementById('last-'+player);
  panel.className='last-sess visible';
  panel.innerHTML=`<div class="last-loading"><i class="ti ti-loader-2"></i>Chargement dernière séance…</div>`;
  try{
    const data=await sbGet(`player=eq.${player}&type=eq.${type}&limit=1`);
    if(!data.length){
      panel.innerHTML=`<div class="last-sess-header"><span class="last-sess-label"><i class="ti ti-clock-off"></i>Aucune séance ${type} précédente</span></div>`;
      return;
    }
    const s=data[0];
    const color=player==='theo'?'var(--T2)':'var(--N2)';
    const exHtml=s.exercises.map(e=>`
      <div class="last-ex">
        <div class="last-ex-name">
          ${e.name}
          ${e.rest?`<span class="rest-tag">${e.rest}</span>`:''}
        </div>
        <div class="last-series">
          ${e.series.map((sr,i)=>`<span class="last-pill">${i+1}. ${sr.reps||'—'} rep${sr.wt?` × ${sr.wt}kg`:''}</span>`).join('')}
        </div>
      </div>`).join('');
    panel.innerHTML=`
      <div class="last-sess-header">
        <span class="last-sess-label" style="color:${color}"><i class="ti ti-history"></i>Dernière séance ${type.toUpperCase()}</span>
        <span class="last-sess-date">${fmtDate(s.date)}</span>
      </div>
      ${s.note?`<div class="last-note">"${s.note}"</div>`:''}
      ${exHtml}`;
  }catch(e){
    panel.innerHTML=`<div class="last-loading" style="color:var(--red)">Erreur chargement</div>`;
  }
}

function applyTemplate(player){
  const t=picked[player]||'pull';
  const tpl=TPLS[t]||TPLS.pull;
  S[player]={};
  tpl.forEach(ex=>addEx(player,ex));
  if(!picked[player]){
    picked[player]='pull';
    document.querySelector(`.type-btn[data-p="${player}"][data-t="pull"]`).className='type-btn sel-pull';
  }
  toast('Template chargé');
}

// ─── SAVE SESSION ─────────────────────────────────────────────────────────────
async function saveSession(player){
  const btn=document.getElementById('btn-save-'+player);
  const date=document.getElementById(player+'-date').value||today();
  const type=picked[player];
  const note=document.getElementById(player+'-note').value.trim();
  if(!type){toast('Choisis un type de séance','err');return;}
  const exercises=Object.values(S[player])
    .filter(e=>e.name.trim())
    .map(e=>({name:e.name,rest:e.rest,series:e.series.filter(s=>s.reps||s.wt)}));
  if(!exercises.length){toast('Ajoute au moins un exercice','err');return;}
  btn.disabled=true;setStatus('loading','Enregistrement…');
  try{
    await sbInsert({player,date,type,note,exercises});
    S[player]={};renderExList(player);
    document.getElementById(player+'-note').value='';
    picked[player]='';
    document.querySelectorAll(`.type-btn[data-p="${player}"]`).forEach(b=>b.className='type-btn');
    document.getElementById(player+'-date').value=today();
    document.getElementById('last-'+player).className='last-sess';
    setStatus('ok','Connecté à Supabase');
    toast('Séance enregistrée !');
  }catch(e){
    setStatus('err','Erreur sauvegarde');
    toast('Erreur : '+e.message,'err');
  }finally{btn.disabled=false;}
}

// ─── HISTORY ─────────────────────────────────────────────────────────────────
async function loadHistory(){
  const wrap=document.getElementById('history-wrap');
  wrap.innerHTML=`<div class="loading-wrap"><i class="ti ti-loader-2"></i><p>Chargement…</p></div>`;
  const fp=document.getElementById('f-player').value;
  const ft=document.getElementById('f-type').value;
  let q='';
  if(fp!=='all')q+=`player=eq.${fp}&`;
  if(ft!=='all')q+=`type=eq.${ft}&`;
  try{
    const data=await sbGet(q.slice(0,-1));
    if(!data.length){wrap.innerHTML=`<div class="empty"><i class="ti ti-barbell"></i><p>Aucune séance enregistrée</p></div>`;return;}
    wrap.innerHTML=data.map(s=>{
      const exRows=s.exercises.map(e=>{
        const pills=e.series.map(sr=>`<span class="pill">${sr.reps||'—'}${sr.wt?'×'+sr.wt+'kg':''}</span>`).join('');
        return`<tr><td style="color:var(--text)">${e.name}</td><td style="font-family:'DM Mono',monospace;font-size:10px">${e.rest||'—'}</td><td>${pills}</td></tr>`;
      }).join('');
      return`<div class="sess-card">
        <div class="sess-head">
          <span class="badge-player ${s.player}">${s.player==='theo'?'THÉO':'NATHAN'}</span>
          <span class="badge-type badge-${s.type}">${s.type.toUpperCase()}</span>
          <span class="sess-date"><i class="ti ti-calendar" style="font-size:12px;vertical-align:-2px;margin-right:3px"></i>${fmtDate(s.date)}</span>
          <button class="btn-icon" style="margin-left:auto" onclick="deleteSession('${s.id}')" title="Supprimer"><i class="ti ti-trash" style="color:var(--text3)"></i></button>
        </div>
        ${s.note?`<div class="sess-note">"${s.note}"</div>`:''}
        <table class="ex-table"><thead><tr><th>Exercice</th><th>Repos</th><th>Séries</th></tr></thead><tbody>${exRows}</tbody></table>
      </div>`;
    }).join('');
  }catch(e){
    wrap.innerHTML=`<div class="empty"><i class="ti ti-wifi-off"></i><p>Erreur chargement : ${e.message}</p></div>`;
  }
}

async function deleteSession(id){
  if(!confirm('Supprimer cette séance ?'))return;
  try{
    await sbDelete(id);
    toast('Séance supprimée');
    loadHistory();
  }catch(e){toast('Erreur suppression','err');}
}

// ─── STATS ────────────────────────────────────────────────────────────────────
let allSessions=[];
async function loadAllSessions(){
  try{allSessions=await sbGet('');}
  catch(e){allSessions=[];}
}

function calcP(player){
  const ss=allSessions.filter(s=>s.player===player);
  const sets=ss.reduce((a,s)=>a+s.exercises.reduce((b,e)=>b+e.series.length,0),0);
  const reps=ss.reduce((a,s)=>a+s.exercises.reduce((b,e)=>b+e.series.reduce((c,sr)=>c+(parseInt(sr.reps)||0),0),0),0);
  const bt={pull:0,push:0,legs:0,custom:0};
  ss.forEach(s=>bt[s.type]=(bt[s.type]||0)+1);
  return{count:ss.length,sets,reps,bt,sessions:ss};
}

let curStatTab='overview';
function switchStatTab(tab,btn){
  curStatTab=tab;
  document.querySelectorAll('.stat-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  ['overview','exercises','compare'].forEach(t=>document.getElementById('stat-'+t).style.display=t===tab?'block':'none');
  renderStatTab(tab);
}

async function renderStats(tab){
  await loadAllSessions();
  renderStatTab(tab);
}

function renderStatTab(tab){
  if(tab==='overview')renderOverview();
  if(tab==='exercises')renderExercises();
  if(tab==='compare')renderCompare();
}

function renderOverview(){

  el.innerHTML=`
    <div class="dual" style="margin-bottom:1.25rem">
      <div>
        <div style="font-family:'DM Mono',monospace;font-size:10px;color:var(--T2);letter-spacing:1.5px;margin-bottom:10px">— THÉO</div>
        <div class="metric-grid">
          <div class="metric"><div class="v v-T">${T.count}</div><div class="l">Séances</div></div>
          <div class="metric"><div class="v v-T">${T.sets}</div><div class="l">Séries</div></div>
          <div class="metric"><div class="v v-T">${T.reps}</div><div class="l">Reps</div></div>
        </div>
        <div style="display:flex;gap:5px;flex-wrap:wrap">
          ${Object.entries(T.bt).filter(([,n])=>n).map(([t,n])=>`<span class="badge-type badge-${t}">${t.toUpperCase()} ×${n}</span>`).join('')}
        </div>
      </div>
      <div>
        <div style="font-family:'DM Mono',monospace;font-size:10px;color:var(--N2);letter-spacing:1.5px;margin-bottom:10px">— NATHAN</div>
        <div class="metric-grid">
          <div class="metric"><div class="v v-N">${N.count}</div><div class="l">Séances</div></div>
          <div class="metric"><div class="v v-N">${N.sets}</div><div class="l">Séries</div></div>
          <div class="metric"><div class="v v-N">${N.reps}</div><div class="l">Reps</div></div>
        </div>
        <div style="display:flex;gap:5px;flex-wrap:wrap">
          ${Object.entries(N.bt).filter(([,n])=>n).map(([t,n])=>`<span class="badge-type badge-${t}">${t.toUpperCase()} ×${n}</span>`).join('')}
        </div>
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Activité — 8 dernières semaines</div>
      <div class="chart-wrap"><canvas id="act-chart"></canvas></div>
    </div>`;
  setTimeout(buildActivityChart,50);
}

function buildActivityChart(){
  const ctx=document.getElementById('act-chart');if(!ctx)return;
  if(_chart){_chart.destroy();_chart=null;}
  const weeks=[];const now=new Date();
  for(let i=8;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i*7);weeks.push(d.toISOString().slice(0,10));}
  const labels=weeks.slice(1).map((w,i)=>{const d=new Date(w);return`${d.getDate()}/${d.getMonth()+1}`});
  function count(p,from,to){return allSessions.filter(s=>s.player===p&&s.date>=from&&s.date<to).length;}
  const td=weeks.slice(1).map((w,i)=>count('theo',weeks[i],w));
  const nd=weeks.slice(1).map((w,i)=>count('nathan',weeks[i],w));
  _chart=new Chart(ctx,{type:'bar',
    data:{labels,datasets:[
      {label:'Théo',data:td,backgroundColor:'rgba(108,99,255,.65)',borderRadius:4,borderSkipped:false},
      {label:'Nathan',data:nd,backgroundColor:'rgba(255,79,109,.65)',borderRadius:4,borderSkipped:false}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:'#8888a0',font:{size:11},boxWidth:10}}},
      scales:{
        x:{ticks:{color:'#4a4a60',font:{size:10}},grid:{color:'rgba(255,255,255,.03)'}},
        y:{ticks:{color:'#4a4a60',stepSize:1,font:{size:10}},grid:{color:'rgba(255,255,255,.05)'}}
      }}
  });
}

function renderExercises(){
  const map={};
  allSessions.forEach(s=>{
    s.exercises.forEach(e=>{
      const k=e.name.trim().toLowerCase();
      if(!map[k])map[k]={name:e.name,theo:0,nathan:0,maxW:0,reps:0};
      map[k][s.player]++;
      e.series.forEach(sr=>{
        const w=parseFloat(sr.wt)||0;
        if(w>map[k].maxW)map[k].maxW=w;
        map[k].reps+=parseInt(sr.reps)||0;
      });
    });
  });
  const rows=Object.values(map).sort((a,b)=>(b.theo+b.nathan)-(a.theo+a.nathan)).slice(0,20);
  const el=document.getElementById('stat-exercises');
  if(!rows.length){el.innerHTML=`<div class="empty"><i class="ti ti-dumbbell"></i><p>Aucun exercice</p></div>`;return;}
  el.innerHTML=`<div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden">
    <table class="ex-stats-table">
      <thead><tr>
        <th>Exercice</th>
        <th style="text-align:center;color:var(--T2)">Théo</th>
        <th style="text-align:center;color:var(--N2)">Nathan</th>
        <th style="text-align:center">Max kg</th>
        <th style="text-align:center">Total reps</th>
      </tr></thead>
      <tbody>${rows.map(e=>`<tr>
        <td>${e.name}</td>
        <td style="text-align:center;color:var(--T2);font-family:'DM Mono',monospace">${e.theo||'—'}</td>
        <td style="text-align:center;color:var(--N2);font-family:'DM Mono',monospace">${e.nathan||'—'}</td>
        <td style="text-align:center;font-family:'DM Mono',monospace;color:var(--yellow)">${e.maxW||'—'}</td>
        <td style="text-align:center;font-family:'DM Mono',monospace">${e.reps}</td>
      </tr>`).join('')}</tbody>
    </table>
  </div>`;
}

function renderCompare(){
  const T=calcP('theo'),N=calcP('nathan');
  const metrics=[
    {k:'Séances',t:T.count,n:N.count},
    {k:'Séries totales',t:T.sets,n:N.sets},
    {k:'Reps totales',t:T.reps,n:N.reps},
    {k:'Pull',t:T.bt.pull||0,n:N.bt.pull||0},
    {k:'Push',t:T.bt.push||0,n:N.bt.push||0},
    {k:'Legs',t:T.bt.legs||0,n:N.bt.legs||0},
  ];
  const el=document.getElementById('stat-compare');
  el.innerHTML=`<div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem">
    <div style="display:flex;justify-content:space-between;margin-bottom:1.25rem">
      <span class="badge-player theo">THÉO</span>
      <span class="badge-player nathan">NATHAN</span>
    </div>
    ${metrics.map(m=>{
      const tot=m.t+m.n||1;
      const tp=Math.round(m.t/tot*100),np=Math.round(m.n/tot*100);
      return`<div class="compare-row">
        <div class="lbl">
          <span style="color:var(--T2);font-family:'DM Mono',monospace;font-size:11px">${m.t}</span>
          <span class="key">${m.k}</span>
          <span style="color:var(--N2);font-family:'DM Mono',monospace;font-size:11px">${m.n}</span>
        </div>
        <div class="compare-bar-track">
          <div class="bar bar-T" style="width:${tp}%"></div>
          <div class="bar bar-N" style="width:${np}%"></div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
document.getElementById('theo-date').value=today();
document.getElementById('nathan-date').value=today();
</script>
</body>
</html>
